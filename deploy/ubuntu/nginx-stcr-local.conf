# Local-only STCR validation endpoint used before a production domain and TLS
# certificate are available. It does not claim any public interface or port.
limit_req_zone $binary_remote_addr zone=stcr_api_local:10m rate=20r/s;

server {
    listen 127.0.0.1:8300;
    server_name localhost;
    server_tokens off;

    root /var/www/stcr;
    index index.html;
    client_max_body_size 64k;
    limit_req_status 429;

    access_log /var/log/nginx/stcr-local.access.log;
    error_log /var/log/nginx/stcr-local.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        proxy_pass http://127.0.0.1:3001/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:3001/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /runtime-config.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /stcr/api/ {
        limit_req zone=stcr_api_local burst=40 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_next_upstream off;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
